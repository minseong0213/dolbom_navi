name: pregnant_nav
description: Low-impact pregnancy navigation MVP.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_map: ^7.0.2
  flutter_tts: ^4.2.5
  geolocator: ^14.0.3
  google_fonts: ^8.1.0
  http: ^1.2.2
  latlong2: ^0.9.1
  path_provider: ^2.1.6
  permission_handler: ^11.3.1
  sensors_plus: ^7.1.0
  tmap_ui_sdk:
    path: vendor/tmap_ui_sdk

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
